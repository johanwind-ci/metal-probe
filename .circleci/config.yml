# CircleCI M4 Pro probe. Gated behind a pipeline parameter so ordinary pushes don't spend
# macOS credits (m4pro.medium = 200 credits/min; free plan = 30k credits/month).
# Trigger: POST /api/v2/project/gh/johanwind-ci/metal-probe/pipeline {"parameters": {"run_probe": true}}
version: 2.1

parameters:
  run_probe:
    type: boolean
    default: false

jobs:
  probe:
    macos:
      xcode: "26.6"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: System info
          command: |
            sw_vers
            sysctl machdep.cpu.brand_string hw.model hw.ncpu hw.memsize kern.hv_vmm_present || true
            system_profiler SPHardwareDataType SPDisplaysDataType
      - run:
          name: Metal probe
          command: |
            swiftc -swift-version 5 -O probe.swift -o probe
            ./probe | tee probe.txt
      - run:
          name: PyTorch MPS check
          command: |
            python3 -m venv venv
            venv/bin/pip install --quiet torch
            venv/bin/python mps_check.py | tee mps.txt || true
      - store_artifacts:
          path: probe.txt
      - store_artifacts:
          path: mps.txt

workflows:
  probe:
    when: << pipeline.parameters.run_probe >>
    jobs:
      - probe
