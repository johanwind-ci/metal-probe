# CircleCI M4 Pro (m4pro.medium = 200 credits/min; free plan = 30k credits/month).
# Both workflows are gated behind pipeline parameters so ordinary pushes spend nothing.
#   probe:   circleci run trigger --parameter run_probe=true
#   session: circleci run trigger --parameter session=true --parameter pubkey="..." --parameter port=4xxxx
#            (driven by ~/.agents/skills/metal-spot/metal.sh; see ci/session.sh)
version: 2.1

parameters:
  run_probe:
    type: boolean
    default: false
  session:
    type: boolean
    default: false
  pubkey:
    type: string
    default: ""
  port:
    type: integer
    default: 0
  minutes:
    type: integer
    default: 20

jobs:
  probe:
    macos:
      xcode: "26.6"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: System info
          command: |
            sw_vers
            sysctl machdep.cpu.brand_string hw.model hw.ncpu hw.memsize kern.hv_vmm_present || true
            system_profiler SPHardwareDataType SPDisplaysDataType
      - run:
          name: Metal probe
          command: |
            swiftc -swift-version 5 -O probe.swift -o probe
            ./probe | tee probe.txt
      - run:
          name: PyTorch MPS check
          command: |
            python3 -m venv venv
            venv/bin/pip install --quiet torch
            venv/bin/python mps_check.py | tee mps.txt || true
      - store_artifacts:
          path: probe.txt
      - store_artifacts:
          path: mps.txt

  session:
    macos:
      xcode: "26.6"
    resource_class: m4pro.medium
    environment:
      PUBKEY: << pipeline.parameters.pubkey >>
      PORT: << pipeline.parameters.port >>
      MINUTES: << pipeline.parameters.minutes >>
      SESSION_ID: << pipeline.id >>
    steps:
      - checkout
      - run:
          name: SSH session
          no_output_timeout: 30m
          command: bash ci/session.sh

workflows:
  probe:
    when: << pipeline.parameters.run_probe >>
    jobs:
      - probe
  session:
    when: << pipeline.parameters.session >>
    jobs:
      - session
