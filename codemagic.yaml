# Codemagic: start these manually from the UI (Start new build -> pick workflow).
# mac_mini_m4 is billed from the first minute ($0.114/min); mac_mini_m2 uses the 500 free min/month.
definitions:
  scripts: &probe_scripts
    - name: System info
      script: |
        sw_vers
        sysctl machdep.cpu.brand_string hw.model hw.ncpu hw.memsize kern.hv_vmm_present || true
        system_profiler SPHardwareDataType SPDisplaysDataType
    - name: Metal probe
      script: |
        swiftc -swift-version 5 -O probe.swift -o probe
        ./probe | tee probe.txt
    - name: PyTorch MPS check
      ignore_failure: true
      script: |
        python3 -m venv venv
        venv/bin/pip install --quiet torch
        venv/bin/python mps_check.py | tee mps.txt

workflows:
  metal-probe-m2:
    name: Metal probe (M2)
    instance_type: mac_mini_m2
    max_build_duration: 120  # cap for non-Enterprise; bounds SSH session length
    scripts: *probe_scripts
    artifacts:
      - "*.txt"
  metal-probe-m4:
    name: Metal probe (M4)
    instance_type: mac_mini_m4
    max_build_duration: 20
    scripts: *probe_scripts
    artifacts:
      - "*.txt"
