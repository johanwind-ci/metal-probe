name: ssh
# Manual-only SSH session on a GitHub-hosted Mac, via ci/session.sh (key-only sshd + bore.pub tunnel).
# Driven by ~/.agents/skills/metal-spot/metal.sh; by hand:
#   gh workflow run ssh.yml -f pubkey="$(cat key.pub)" -f port=4xxxx   then   ssh -p 4xxxx runner@bore.pub
on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: "SSH public key allowed to log in"
        required: true
        type: string
      port:
        description: "Remote port on bore.pub (random, 20000-60000)"
        required: true
        type: string
      minutes:
        description: "Session length in minutes (extendable up to the 120 min job timeout)"
        default: "30"
        type: string
      runner:
        description: "runs-on label (macos-latest = free M1 on a public repo)"
        default: "macos-latest"
        type: string

jobs:
  ssh:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: SSH session
        env:
          PUBKEY: ${{ inputs.pubkey }}
          PORT: ${{ inputs.port }}
          MINUTES: ${{ inputs.minutes }}
          SESSION_ID: ${{ github.run_id }}
        run: bash ci/session.sh
